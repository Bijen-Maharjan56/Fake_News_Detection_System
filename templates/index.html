<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake News Detection</title>

    <!-- External CSS -->
    <link
      rel="stylesheet"
      href="{{url_for('static', filename='css/style.css')}}"
    />
  </head>
  <body>
    <div class="container">
      <h1>Fake News <br /><span>Detection System</span></h1>

      <!-- Input Section -->
      <div class="input-section">
        <textarea
          id="newsInput"
          placeholder="Enter news article or headline here..."
        ></textarea>

        <button id="predictBtn">Predict</button>
      </div>

      <!-- Result Section -->
      <div class="result-container" id="resultContainer">
        <!-- Loader -->
        <div id="loader" style="display: none">
          <p>Analyzing article...</p>
        </div>

        <!-- Error Box -->
        <div id="errorBox" style="display: none">
          <p id="errorText"></p>
        </div>
        <!-- Classification Result -->
        <div class="result-box" id="classificationBox">
          <h3>Classification Result</h3>
          <p id="classification">Waiting for prediction...</p>
        </div>

        <!-- Confidence Score -->
        <div class="result-box">
          <h3>Confidence Score</h3>
          <p id="confidence">--</p>
        </div>

        <!-- Reasoning -->
        <div class="result-box">
          <h3>Reasoning</h3>
          <ul id="reasoning"></ul>
          <!-- <p id="reasoning">
                    The explanation from the model will appear here.
                </p> -->
        </div>
      </div>
    </div>

    <script src="{{url_for('static', filename='js/script.js')}}"></script>
  </body>
</html>
